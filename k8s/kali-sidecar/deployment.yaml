# k8s/kali-sidecar/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kali-sidecar
  namespace: kali-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kali-sidecar
  template:
    metadata:
      labels:
        app: kali-sidecar
    spec:
      containers:
        - name: kali-sidecar
          image: ghcr.io/jon-aliu/kali-mcp-docker/kali-sidecar:latest
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: "128Mi"
              cpu:    "100m"
            limits:
              memory: "512Mi"
              cpu:    "500m"
