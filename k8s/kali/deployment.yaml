# k8s/kali/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kali
  namespace: kali-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kali
  template:
    metadata:
      labels:
        app: kali
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: kali
          image: ghcr.io/jon-aliu/kali-mcp-docker/kali:latest
          resources:
            requests:
              memory: "512Mi"
              cpu:    "250m"
            limits:
              memory: "2Gi"
              cpu:    "1000m"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
              drop:
                - ALL
          volumeMounts:
            - name: kali-results
              mountPath: /home/kaliuser/results
      volumes:
        - name: kali-results
          emptyDir: {}
