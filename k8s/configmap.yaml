# k8s/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kali-mcp-config
  namespace: kali-mcp
data:
  POSTGRES_DB:      "kalimcp"
  POSTGRES_USER:    "kalimcp"
  REDIS_HOST:       "redis-svc"
  REDIS_PORT:       "6379"
  OLLAMA_HOST:      "http://ollama-svc:11434"
  KALI_SIDECAR_URL: "http://kali-sidecar-svc:5000"
  APP_ENV:          "production"
  OPENAI_MODEL:     "gpt-4o"
  OLLAMA_MODEL:     "llama3"
